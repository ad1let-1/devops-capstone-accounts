name: Capture public Kanban board

on:
  push:
    paths:
      - .github/workflows/capture-board.yaml
      - scripts/capture-board.cjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm install playwright
          npx playwright install chromium --with-deps
      - name: Capture project board
        run: node scripts/capture-board.cjs
      - name: Publish screenshots
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add evidence/*.png
          git commit -m 'Capture public Kanban evidence' || exit 0
          git push
