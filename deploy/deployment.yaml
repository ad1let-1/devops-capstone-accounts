apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: accounts
  name: accounts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounts
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: accounts
    spec:
      containers:
      - image: accounts:1.0
        name: accounts
        imagePullPolicy: Never
        resources: {}

        env:
        - name: DATABASE_URI
          value: sqlite:////tmp/accounts.db
        - name: FORCE_HTTPS
          value: "false"
status: {}
